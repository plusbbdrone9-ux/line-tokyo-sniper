version: '3.8'

services:
  line-tokyo-sniper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: line-tokyo-sniper
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
